<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copiloto — testes e lint</title>
<style>
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     max-width:900px;margin:0 auto;padding:1.5rem 1rem 4rem;color:#16191d;background:#f6f7f8}
h1{font-size:1.2rem} h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:#5d666f;margin-top:2rem}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e2e6ea;border-radius:12px;overflow:hidden}
th,td{padding:.5rem .6rem;text-align:left;border-bottom:1px solid #e2e6ea;font-size:.88rem;vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:#5d666f}
.ok{color:#0d7a5f;font-weight:700} .fail{color:#c0392b;font-weight:700}
.sumario{padding:.8rem 1rem;border-radius:12px;font-weight:700;margin:1rem 0}
.verde{background:#e8f4f0;color:#0d7a5f;border-left:4px solid #0d7a5f}
.vermelho{background:#fdecea;color:#c0392b;border-left:4px solid #c0392b}
.amarelo{background:#fff6e0;color:#9a6700;border-left:4px solid #9a6700}
code{background:#eef1f4;padding:.05rem .3rem;border-radius:4px;font-size:.86em}
</style>
</head>
<body>
<h1>Copiloto Clínico — testes e lint</h1>
<div id="sumario"></div>
<h2>Calculadoras</h2><table id="tc"><thead><tr><th>Caso</th><th>Obtido</th><th>Esperado</th><th></th></tr></thead><tbody></tbody></table>
<h2>Lint de fontes</h2><div id="lint"></div>

<script src="queixas.js"></script>
<script src="oms-lms.js"></script>
<script src="calculadoras.js"></script>
<script src="fontes.js"></script>
<script src="guia-contrato.js"></script>
<script src="eem.js"></script>
<script src="psicofarmacos.js"></script>
<script>
(function(){
  var C = {}; CALCS.forEach(function(c){ C[c.id] = c; });
  var falhas = 0, linhas = [];

  function faixa(c, n){ var f = (c.faixas||[]).filter(function(x){ return n >= x[0]; })[0]; return f ? f[1] : '—'; }
  function ver(nome, obtido, esperado){
    var ok = String(obtido) === String(esperado);
    if (!ok) falhas++;
    linhas.push('<tr><td>' + nome + '</td><td><code>' + obtido + '</code></td><td><code>' + esperado +
                '</code></td><td class="' + (ok?'ok':'fail') + '">' + (ok?'ok':'FALHOU') + '</td></tr>');
  }

  /* IMC — aritmética pura, OMS */
  var imc = C.imc, r = imc.calc({peso:70, alt:1.75});
  ver('IMC 70 kg · 1,75 m', r.toFixed(2), '22.86');
  ver('IMC 70 kg · 1,75 m → faixa', faixa(imc, r), 'Eutrofia');
  ver('IMC 95 kg · 1,70 m → faixa', faixa(imc, imc.calc({peso:95, alt:1.70})), 'Obesidade grau I');

  /* CKD-EPI 2021 — conferidos contra a calculadora da NKF, tolerância de arredondamento */
  var ck = C.ckdepi;
  ver('CKD-EPI ♂ 60 a · Cr 1,2', ck.calc({cr:1.2, idade:60, sexo:'m'}).toFixed(1), '69.2');
  ver('CKD-EPI ♂ 60 a · Cr 1,2 → estágio', faixa(ck, ck.calc({cr:1.2, idade:60, sexo:'m'})), 'G2 — redução leve');
  ver('CKD-EPI ♀ 55 a · Cr 0,9', ck.calc({cr:0.9, idade:55, sexo:'f'}).toFixed(1), '75.5');
  ver('CKD-EPI ♂ 70 a · Cr 2,0 → estágio', faixa(ck, ck.calc({cr:2.0, idade:70, sexo:'m'})), 'G3b — moderada a grave');

  /* Näegele — só a DPP é testável de forma estável (a IG depende de hoje) */
  var dpp = C.dpp.calc({dum:'2026-01-10'});
  ver('Näegele DUM 10/01/2026 → DPP', /DPP 17\/10\/2026/.test(dpp), 'true');
  ver('Näegele DUM 31/12/2025 → DPP', /DPP 07\/10\/2026/.test(C.dpp.calc({dum:'2025-12-31'})), 'true');
  ver('Näegele com DUM no futuro avisa', /futuro/.test(C.dpp.calc({dum:'2099-01-01'})), 'true');

  /* PHQ-9 — o caso que importa é o último: pontuação mínima MAS item 9 positivo */
  var p = C.phq9, todos3 = {}, zeros = {};
  p.campos.forEach(function(f){ todos3[f.id] = 3; zeros[f.id] = 0; });
  ver('PHQ-9 tudo 3', p.calc(todos3), 27);
  ver('PHQ-9 tudo 3 → faixa', faixa(p, 27), 'Depressão grave');
  ver('PHQ-9 tudo 3 → alerta dispara', !!p.alerta(todos3), 'true');
  ver('PHQ-9 tudo 0', p.calc(zeros), 0);
  ver('PHQ-9 tudo 0 → alerta silencioso', !!p.alerta(zeros), 'false');
  zeros.q9 = 1;
  ver('PHQ-9 zeros mas item 9 = 1 → total', p.calc(zeros), 1);
  ver('PHQ-9 zeros mas item 9 = 1 → faixa', faixa(p, 1), 'Mínima');
  ver('PHQ-9 zeros mas item 9 = 1 → ALERTA MESMO ASSIM', !!p.alerta(zeros), 'true');

  /* GAD-7 */
  var g = C.gad7, g3 = {}, g0 = {};
  g.campos.forEach(function(f){ g3[f.id] = 3; g0[f.id] = 0; });
  ver('GAD-7 tudo 3', g.calc(g3), 21);
  ver('GAD-7 tudo 3 → faixa', faixa(g, 21), 'Ansiedade grave');
  ver('GAD-7 tudo 0 → faixa', faixa(g, 0), 'Mínima');

  /* Integridade dos instrumentos */
  ver('PHQ-9 tem 9 itens', p.campos.length, 9);
  ver('GAD-7 tem 7 itens', g.campos.length, 7);

  /* ---------- antropometria infantil: escore-z OMS + SISVAN ----------
     O caso de referência é o ex2 (menina, 8,650 kg, 76 cm). O ChatGPT
     escreveu "próximo ou acima do P97, vale conferir"; o número é +3,05.
     Conferidos contra as expanded tables da OMS lidas direto do .xlsx. */
  var A = C['antropo-infantil'];
  function zde(ind, sexo, meses, valor){ var r = omsZ(ind, sexo, meses, valor); return r ? r.z.toFixed(2) : 'null'; }
  function cl(ind, meses, z){ var c = sisvan(ind, meses, z); return c ? c[1] : 'null'; }
  function linha(out, rot){
    var l = (out || []).filter(function(x){ return x.rot === rot; })[0];
    return l ? l.val : 'ausente';
  }

  ver('ex2 · 8 m · peso 8,650 kg → z peso/idade', zde('peso', 'f', 8, 8.650), '0.69');
  ver('ex2 · 8 m · 76 cm → z estatura/idade', zde('estatura', 'f', 8, 76), '3.05');
  ver('ex2 · 8 m · IMC → z IMC/idade', zde('imc', 'f', 8, 8.650 / (0.76 * 0.76)), '-1.33');
  /* A classificação do SISVAN não tem corte superior de estatura: +3,05 sai como
     "adequada". Por isso o escore é a manchete na tela e o rótulo vem depois. */
  ver('ex2 · estatura +3,05 → SISVAN ainda diz adequada', cl('estatura', 8, 3.05), 'Estatura adequada para a idade');
  ver('ex2 · peso +0,69 → SISVAN', cl('peso', 8, 0.69), 'Peso adequado para a idade');
  ver('ex2 · IMC −1,33 → SISVAN', cl('imc', 8, -1.33), 'Eutrofia');
  /* A contradição da nota não é cosmética: 7 meses em vez de 8 move 0,71 DP. */
  ver('ex2 · a MESMA medida aos 7 m → z estatura', zde('estatura', 'f', 7, 76), '3.76');
  ver('ex2 · escore fora de ±3 DP dispara alerta',
      !!A.alerta({sexo:'f', meses:8, peso:8.650, est:76}), 'true');
  /* cauda não pode virar P100 nem P0: percentil que não existe */
  ver('percentil de +3,05 não arredonda para P100',
      linha(A.calc({sexo:'f', meses:8, est:76}), 'Estatura para idade').indexOf('P100') < 0, 'true');
  /* e não pode sair verde ao lado de um alerta pedindo para conferir */
  ver('linha fora de ±3 DP não sai verde', (function(){
      var l = A.calc({sexo:'f', meses:8, est:76}).filter(function(x){ return x.rot === 'Estatura para idade'; })[0];
      return l.cls !== 'acc';
  })(), 'true');
  ver('criança dentro da faixa não dispara alerta',
      !!A.alerta({sexo:'f', meses:8, peso:8.0, est:69}), 'false');

  ver('ex1 · 7 anos usa a tabela 5-10 anos', zde('peso', 'f', 84, 22), '-0.11');
  ver('peso/idade não existe acima de 10 anos', String(omsZ('peso', 'f', 130, 30)), 'null');
  ver('estatura/idade continua existindo aos 130 meses', zde('estatura', 'f', 130, 145), '0.16');

  /* O mesmo escore-z muda de nome aos 5 anos. É o erro que um modelo comete. */
  ver('IMC z +1,5 aos 59 meses', cl('imc', 59, 1.5), 'Risco de sobrepeso');
  ver('IMC z +1,5 aos 61 meses', cl('imc', 61, 1.5), 'Sobrepeso');
  ver('IMC z +2,5 aos 59 meses', cl('imc', 59, 2.5), 'Sobrepeso');
  ver('IMC z +2,5 aos 61 meses', cl('imc', 61, 2.5), 'Obesidade');
  ver('IMC z −3,5 em qualquer idade', cl('imc', 30, -3.5), 'Magreza acentuada');
  ver('estatura z −2,5 → baixa estatura', cl('estatura', 30, -2.5), 'Baixa estatura para a idade');
  ver('peso z −3,5 → muito baixo peso', cl('peso', 30, -3.5), 'Muito baixo peso para a idade');
  ver('perímetro cefálico não tem quadro no SISVAN', String(sisvan('pc', 8, 0)), 'null');
  ver('perímetro cefálico ainda devolve escore', zde('pc', 'f', 8, 44), '0.47');

  /* Correção da OMS nas caudas: sem ela, L negativo com valor extremo vira NaN. */
  ver('peso absurdo não vira NaN', isFinite(omsZ('peso', 'f', 8, 30).z), 'true');

  /* ---------- peso para estatura: DUAS tabelas, escolhidas por idade ----------
     O índice que o AIDPI usa para emaciação, e o único que não depende da idade
     ser confiável. A mediana valendo exatamente z=0 prova que a tabela certa foi
     escolhida: 11,5007 kg em 85 cm é a mediana DEITADO, 11,6707 a mediana EM PÉ. */
  function pe(sexo, meses, cm, peso){
    var r = omsPesoEstatura(sexo, meses, cm, peso);
    return r ? r.z.toFixed(2) : 'null';
  }
  ver('mediana deitado (85 cm, 18 m) → z zero', pe('m', 18, 85, 11.5007), '0.00');
  ver('mediana em pé (85 cm, 30 m) → z zero', pe('m', 30, 85, 11.6707), '0.00');
  /* A troca de tabela aos 2 anos move o escore — é por isso que ela existe. */
  ver('mesma medida aos 23 meses (deitado)', pe('f', 23, 76, 8.650), '-0.86');
  ver('mesma medida aos 24 meses (em pé)', pe('f', 24, 76, 8.650), '-1.02');
  ver('ex2 · 8 m · peso para estatura', pe('f', 8, 76, 8.650), '-0.86');
  ver('ex2 · peso/estatura → SISVAN', cl('pesoest', 8, -0.86), 'Eutrofia');
  ver('emaciação grave classifica', cl('pesoest', 12, -3.71), 'Magreza acentuada');
  ver('quadro 6 usa "risco de sobrepeso"', cl('pesoest', 12, 1.5), 'Risco de sobrepeso');
  /* Limites publicados: 45–110 cm deitado, 65–120 cm em pé, e só até 5 anos. */
  ver('abaixo de 45 cm não existe', pe('f', 2, 44.9, 2.4), 'null');
  ver('acima de 120 cm não existe', pe('m', 58, 121, 22), 'null');
  ver('64 cm em pé está fora da tabela', pe('m', 30, 64, 7), 'null');
  ver('acima de 5 anos o SISVAN manda usar IMC', pe('m', 61, 110, 19), 'null');
  ver('peso/estatura absurdo não vira NaN', isFinite(omsPesoEstatura('m', 12, 80, 30).z), 'true');
  ver('peso/estatura entra na antropometria',
      linha(A.calc({sexo:'f', meses:8, peso:8.650, est:76}), 'Peso para estatura').indexOf('z −0,86') === 0, 'true');
  ver('a linha diz qual técnica foi usada',
      /\(deitado\)$/.test(linha(A.calc({sexo:'f', meses:8, peso:8.650, est:76}), 'Peso para estatura')), 'true');

  ver('antropometria roda só com peso',
      linha(A.calc({sexo:'f', meses:8, peso:8.650}), 'Peso para idade').indexOf('z +0,69') === 0, 'true');
  ver('sem nenhuma medida não devolve nada',
      String(A.calc({sexo:'f', meses:8})), 'null');

  /* ---------- dose por peso ---------- */
  var D = C['dose-peso'];
  var d1 = D.calc({peso:8.65, mgkg:15, vezes:'3', conc:50});
  ver('dose 15 mg/kg · 8,65 kg → por tomada', linha(d1, 'Por tomada'), '129,8 mg');
  ver('dose · volume a 50 mg/mL', linha(d1, 'Volume por tomada'), '2,60 mL');
  ver('dose · total do dia', linha(d1, 'Por dia'), '389,3 mg em 3 tomadas');
  ver('dose sem concentração não inventa volume',
      linha(D.calc({peso:8.65, mgkg:15, vezes:'3'}), 'Volume por tomada'), 'ausente');
  ver('dose acima do teto avisa',
      !!D.alerta({peso:8.65, mgkg:15, vezes:'3', teto:100}), 'true');
  ver('dose dentro do teto fica quieta',
      !!D.alerta({peso:8.65, mgkg:15, vezes:'3', teto:500}), 'false');

  /* ---------- conferência da nota ---------- */
  var notaEx2 = 'Paciente, 7 meses, feminina. Queixa de sintomas gripais, há 3 dia. ' +
                'Idade: 8 meses Peso 8,650kg Altura: 76 cm.';
  var notaEx1 = 'Paciente, 7 anos, feminino QP: Feridas aquosas no nariz, mao e perna, ' +
                'há 7 dias. Teve febre há 2 semanas T: 37/38 C.';
  ver('nota ex2 · lê as duas idades', lerNota(notaEx2).idade.join(','), '7,8');
  ver('nota ex2 · lê o peso', lerNota(notaEx2).peso.join(','), '8.65');
  ver('nota ex2 · lê a estatura', lerNota(notaEx2).altura.join(','), '76');
  ver('nota ex2 · aponta a contradição', !!C['nota-conferencia'].alerta({nota:notaEx2}), 'true');
  /* "há 7 dias" e "há 2 semanas" são duração, não idade — falso positivo aqui
     destruiria a confiança no aviso. */
  ver('nota ex1 · duração não vira idade', lerNota(notaEx1).idade.join(','), '84');
  ver('nota ex1 · sem contradição, sem alerta', !!C['nota-conferencia'].alerta({nota:notaEx1}), 'false');
  ver('nota vazia não devolve nada', String(C['nota-conferencia'].calc({nota:'   '})), 'null');

  /* Terceira categoria: nem calcular, nem calar — dizer qual dado falta.
     A nota do ex1 não traz peso, e sem peso não existe dose por peso. */
  function faltas(txt){
    return (C['nota-conferencia'].calc({nota:txt}) || [])
      .filter(function(l){ return l.rot === 'Falta'; }).map(function(l){ return l.val; });
  }
  ver('nota ex1 · aponta que falta o peso',
      faltas(notaEx1).filter(function(t){ return /^peso/.test(t); }).length, 1);
  ver('nota ex1 · diz o que o peso destrava',
      /dose por peso/.test(faltas(notaEx1).join(' ')), 'true');
  ver('nota ex1 · não cobra o que já tem',
      /^idade|^sexo/.test(faltas(notaEx1).join(' ')), 'false');
  ver('nota ex2 · completa não cobra nada', faltas(notaEx2).length, 0);
  ver('nota só com peso cobra idade, sexo e estatura', faltas('Peso 12kg').length, 3);
  /* nota em branco não pode virar lista de cobranças */
  ver('nota vazia não cobra nada', faltas('   ').length, 0);

  /* ---------- contrato da camada generativa ---------- */
  /* S e O por concatenação literal: é a invariante que impede registro de ato
     não praticado. Nos PDFs de referência o ChatGPT devolveu ausculta normal
     numa nota sem exame físico. */
  var soap = montarSOAP('Nota do medico.', {avaliacao_soap:'Impetigo', plano_soap:'Mupirocina'});
  ver('SOAP · S é a nota literal', /^S: Nota do medico\.$/m.test(soap), 'true');
  ver('SOAP · O fica em branco, não inventado', /^O: \[não registrado\]/m.test(soap), 'true');
  ver('SOAP · A vem do modelo', /^A: Impetigo$/m.test(soap), 'true');
  ver('SOAP · nota vazia não vira achado', /^S: \[não registrado\]$/m.test(montarSOAP('', {})), 'true');

  /* O bloco determinístico é o que o modelo recebe como FATO. Se ele parar de
     carregar o escore ou a contradição, o modelo volta a hedgear. */
  var dEx2 = montarDeterministica(notaEx2, {sexo:'f', meses:8, peso:8.650, est:76});
  ver('determinística · acha a contradição', dEx2.contradicoes.length, 1);
  ver('determinística · leva o escore da estatura',
      /z \+3,05/.test(JSON.stringify(dEx2.antropometria)), 'true');
  ver('determinística · leva o alerta de ±3 DP', /Fora de/.test(dEx2.alertaAntro || ''), 'true');
  var pEx2 = guiaPrompt(notaEx2, dEx2);
  ver('prompt · marca CONTRADIÇÕES em caixa alta', /CONTRADIÇÕES:/.test(pEx2), 'true');
  ver('prompt · não emite dígito de dose', /\d+\s*mg\/kg/.test(pEx2), 'false');

  var dEx1 = montarDeterministica(notaEx1, {sexo:'f', meses:84});
  ver('determinística · ex1 sem peso não calcula antropometria', String(dEx1.antropometria), 'null');
  ver('determinística · ex1 cobra o peso', /peso/.test(dEx1.falta.join(' ')), 'true');
  ver('prompt · ex1 diz que a antropometria não é calculável',
      /não calculável/.test(guiaPrompt(notaEx1, dEx1)), 'true');

  /* ---------- validação de fonte ----------
     O buraco que isto fecha: o campo `fonte` era memória do modelo. Ele escrevia
     "SBP, Tratado de Pediatria, 2021" e ninguém conferia se existia. */
  ver('allowlist não está vazio', FONTES_VALIDAS.length > 0, 'true');
  ver('VERIFICAR é sempre válido', fonteValida('VERIFICAR'), 'true');
  ver('fonte da wiki é válida', fonteValida('Calendário Nacional PNI (MS), 2025/26'), 'true');
  ver('fonte inventada é rejeitada', fonteValida('SBP, Tratado de Pediatria, 2021'), 'false');
  ver('fonte vazia é rejeitada', fonteValida(''), 'false');
  /* adaptar o texto da lista também não passa: a conferência é exata */
  ver('fonte quase certa é rejeitada', fonteValida('Calendário Nacional PNI (MS) 2025'), 'false');
  /* procedência interna não é fonte citável num guia clínico */
  ver('arquivo do vault não é fonte citável', fonteValida('guia-bolso-aps.html'), 'false');

  var gFake = {conduta:[{item:'a', farmaco:'', fonte:'MS — Norma Técnica do SISVAN, 2011'},
                        {item:'b', farmaco:'', fonte:'Diretriz inventada 2019'},
                        {item:'c', farmaco:'', fonte:'VERIFICAR'}]};
  validarFontes(gFake);
  ver('validarFontes rebaixa a inventada', gFake.conduta[1].fonte, 'VERIFICAR');
  ver('validarFontes preserva a válida', gFake.conduta[0].fonte, 'MS — Norma Técnica do SISVAN, 2011');
  ver('validarFontes guarda o que foi rebaixado', gFake.fontesRebaixadas.join(''), 'Diretriz inventada 2019');
  ver('validarFontes marca o que passou', gFake.conduta[0].fonteOk, 'true');

  /* injeção da wiki: por palavra-chave, no máximo duas páginas */
  ver('nota de criança puxa a página materno-infantil',
      paginasRelevantes('Lactente de 8 meses com coriza, vacina em dia').indexOf('materno-infantil') > -1, 'true');
  ver('nota de saúde mental puxa a página certa',
      paginasRelevantes('Paciente com depressao e insonia, risco de suicidio').indexOf('saude-mental') > -1, 'true');
  ver('no máximo duas páginas por prompt',
      paginasRelevantes('crianca gestante depressao sigilo hipertensao cirurgia').length <= 2, 'true');
  ver('o prompt leva o allowlist',
      /FONTES CIT/.test(guiaPrompt('Lactente de 8 meses', montarDeterministica('Lactente de 8 meses', {}))), 'true');

  /* ---------- painéis de psiquiatria ----------
     A regra que estes testes travam: em 16/09/2026 o projeto passou a aceitar
     dígito de dose, e a condição foi que TODA dose carregue fonte conferida ou
     o cartão saia marcado VERIFICAR. Sem estes testes a condição é promessa. */
  ver('eem.js carregou', typeof EEM !== 'undefined', 'true');
  ver('EEM tem os domínios do exame', EEM.secoes.length >= 10, 'true');
  ver('EEM tem consciência antes de orientação',
      EEM.secoes.findIndex(function(s){ return /Consci..ncia/.test(s.rot); }) <
      EEM.secoes.findIndex(function(s){ return /Orienta/.test(s.rot); }), 'true');
  ver('EEM termina em juízo crítico e prospecção',
      /Ju.zo cr.tico/.test(EEM.secoes[EEM.secoes.length - 1].rot), 'true');

  var eemSemFonte = EEM.secoes.filter(function(s){ return !s.fonte; });
  ver('toda seção do EEM tem fonte', eemSemFonte.length, '0');
  var eemFonteInvalida = EEM.secoes.filter(function(s){ return !fonteValida(s.fonte); });
  ver('toda fonte do EEM está no allowlist', eemFonteInvalida.length, '0');
  var eemSemPar = EEM.secoes.filter(function(s){
    return s.itens.some(function(i){ return !i.t || !i.d; });
  });
  ver('todo item do EEM tem termo e significado', eemSemPar.length, '0');

  ver('psicofarmacos.js carregou', typeof PSICOFARMACOS !== 'undefined', 'true');
  var FX = [];
  PSICOFARMACOS.classes.forEach(function(c){ c.farmacos.forEach(function(f){ FX.push(f); }); });
  ver('o formulário tem fármacos', FX.length > 20, 'true');
  ver('todo fármaco tem fonte', FX.filter(function(f){ return !f.fonte; }).length, '0');

  /* A INVARIANTE. Dígito de dose só existe com fonte conferida. */
  var DIGITO = /\d/;
  var doseSemFonte = FX.filter(function(f){
    var temDigito = (f.dose || []).some(function(d){ return DIGITO.test(d.val); });
    var fontePendente = f.v || /^VERIFICAR/.test(f.fonte || '');
    return temDigito && fontePendente;
  });
  ver('nenhum dígito de dose sob fonte VERIFICAR',
      doseSemFonte.map(function(f){ return f.nome; }).join(', '), '');

  var fontePendenteSemMarca = FX.filter(function(f){
    return /^VERIFICAR/.test(f.fonte || '') && !f.v;
  });
  ver('fonte VERIFICAR implica cartão marcado', fontePendenteSemMarca.length, '0');

  var fxInvalida = FX.filter(function(f){
    return !fonteValida(f.fonte) && !/^VERIFICAR/.test(f.fonte || '');
  });
  ver('toda fonte do formulário está no allowlist ou é VERIFICAR', fxInvalida.length, '0');

  ver('o formulário cobre as classes do CAPS',
      ['Antipsic', 'Estabilizadores', 'Antidepressivos', 'Benzodiazep'].every(function(t){
        return PSICOFARMACOS.classes.some(function(c){ return c.rot.indexOf(t) > -1; });
      }), 'true');

  /* Os números que mais custam caro se saírem errados. Travados contra o PCDT. */
  function dosesDe(nome){
    var f = FX.filter(function(x){ return x.nome.indexOf(nome) === 0; })[0];
    return f ? f.dose.map(function(d){ return d.val; }).join(' | ') : '';
  }
  ver('lítio · nível terapêutico do PCDT', /0,6 a 1,2 mEq\/L/.test(dosesDe('Carbonato de lítio')), 'true');
  ver('lítio · máximo do PCDT', /1\.800 mg\/dia/.test(dosesDe('Carbonato de lítio')), 'true');
  ver('clozapina · janela de hemograma',
      /SEMANAL nas 18 primeiras semanas/.test(
        FX.filter(function(f){ return f.nome === 'Clozapina'; })[0].monitor), 'true');
  ver('haloperidol · teto agudo do PCDT', /15 mg\/dia/.test(dosesDe('Haloperidol')), 'true');
  ver('lamotrigina · titulação em semanas, não dias',
      /2 SEMANAS/.test(dosesDe('Lamotrigina')), 'true');

  /* ---------- profundidade por fármaco e combinações (16/09/2026, onda 1.5) ---------- */
  ver('todo fármaco diz por que escolher ELE',
      FX.filter(function(f){ return !f.porque; }).length, '0');
  /* Travessão é placeholder, e o renderer o omite: cartão com "—" em
     contraindicação lê na tela como "não tem contraindicação". */
  ver('todo fármaco tem contraindicações, sem placeholder',
      FX.filter(function(f){ return !f.contraind || f.contraind === '\u2014'; }).length, '0');
  ver('todo fármaco diz quando evitar',
      FX.filter(function(f){ return !f.evitar; }).length, '0');

  /* O array `dose` só pode conter DOSE. Pôr linha de recomendação ali fez o teste
     do dígito acusar o aripiprazol — o dado estava no campo errado, não o teste. */
  var REL = [PSICOFARMACOS.combos, PSICOFARMACOS.proibidos, PSICOFARMACOS.dosemuda];
  ver('as três seções de combinação existem',
      REL.every(function(r){ return r && r.itens && r.itens.length; }), 'true');
  ver('toda combinação tem par e explicação',
      REL.reduce(function(n, r){
        return n + r.itens.filter(function(i){ return !i.t || !i.d; }).length;
      }, 0), '0');
  ver('toda combinação tem fonte',
      REL.reduce(function(n, r){
        return n + r.itens.filter(function(i){ return !i.f; }).length;
      }, 0), '0');
  ver('toda fonte de combinação está no allowlist ou é VERIFICAR',
      REL.reduce(function(n, r){
        return n + r.itens.filter(function(i){
          return !fonteValida(i.f) && !/^VERIFICAR/.test(i.f || '');
        }).length;
      }, 0), '0');

  function relTexto(sec){
    return sec.itens.map(function(i){ return i.t + ' ' + i.d; }).join(' | ');
  }
  var txtProib = relTexto(PSICOFARMACOS.proibidos);
  var txtDose  = relTexto(PSICOFARMACOS.dosemuda);
  var txtCombo = relTexto(PSICOFARMACOS.combos);

  /* Os pares cuja ausência custaria caro na enfermaria. */
  ver('proibidos · lítio com diurético, IECA ou AINE', /L.tio \+ diur.tico/.test(txtProib), 'true');
  ver('proibidos · lamotrigina com valproato', /Lamotrigina \+ .cido valproico/.test(txtProib), 'true');
  ver('proibidos · antidepressivo isolado no bipolar', /monoterapia no transtorno bipolar/i.test(txtProib), 'true');
  ver('proibidos · biperideno na acatisia', /Biperideno para acatisia/.test(txtProib), 'true');
  ver('proibidos · glicose antes de tiamina', /glicosado antes de tiamina/.test(txtProib), 'true');
  ver('todo item proibido traz o mecanismo', 
      PSICOFARMACOS.proibidos.itens.filter(function(i){ return i.d.indexOf('MECANISMO') < 0; }).length, '0');

  ver('dose muda função · amitriptilina abaixo de 100 mg', /100 mg\/dia/.test(txtDose), 'true');
  ver('dose muda função · fluoxetina no TOC', /60 a 80 mg/.test(txtDose), 'true');
  ver('dose muda função · cetamina anestésico e antidepressivo', /Cetamina/.test(txtDose), 'true');

  ver('combos · fluoxetina no bipolar só acompanhada',
      /fluoxetina \+ olanzapina, l.tio OU valproato/i.test(txtCombo), 'true');
  ver('combos · potencialização na depressão resistente', /potencializar com antipsic.tico/i.test(txtCombo), 'true');

  /* Correção factual que motivou esta onda: cetamina NÃO é opioide. */
  var ket = FX.filter(function(f){ return /etamina/.test(f.nome); });
  ver('cetamina e escetamina entraram no formulário', ket.length >= 2, 'true');
  ver('a escetamina é descrita como NMDA, não opioide',
      ket.some(function(f){ return /NMDA/.test(f.porque) && !/opioide/i.test(f.porque); }), 'true');
  ver('a escetamina exige ambiente clínico e 2 horas de observação',
      ket.some(function(f){
        return f.dose.some(function(d){ return /DUAS HORAS/i.test(d.val); });
      }), 'true');

  /* A seção farmaco é nova: o lint já cobre fonte, aqui cobre existência. */
  var psiq = QUEIXAS.filter(function(q){ return q.tag === 'Psiquiatria'; });
  ver('as queixas de psiquiatria entraram', psiq.length >= 8, 'true');
  ver('toda queixa de psiquiatria tem tratamento farmacológico',
      psiq.filter(function(q){ return !q.farmaco || !q.farmaco.itens.length; }).length, '0');
  ver('toda queixa de psiquiatria tem red flags',
      psiq.filter(function(q){ return !q.redflags || !q.redflags.itens.length; }).length, '0');
  ver('nota de psicose puxa a página de saúde mental',
      paginasRelevantes('Paciente em surto psicotico, alucinacao auditiva, antipsicotico')
        .indexOf('saude-mental') > -1, 'true');

  document.querySelector('#tc tbody').innerHTML = linhas.join('');

  /* ---------- lint de fontes ---------- */
  var SEC = ['redflags','perguntas','exame','naoperder','ddx','exames','farmaco','conduta','erros'];
  var erros = [], pendencias = 0, totalItens = 0;

  QUEIXAS.forEach(function(qx){
    if (!qx.atualizado) erros.push(qx.id + ': sem campo <code>atualizado</code>');
    if (!qx.nome || !qx.kw) erros.push(qx.id + ': sem <code>nome</code> ou <code>kw</code>');
    (qx.scores||[]).forEach(function(s){
      if (!C[s]) erros.push(qx.id + ': <code>scores</code> aponta para calculadora inexistente <code>' + s + '</code>');
    });
    SEC.forEach(function(k){
      var sec = qx[k];
      if (!sec) return;                                  // ausente é permitido: não renderiza
      if (!sec.itens || !sec.itens.length) { erros.push(qx.id + '/' + k + ': seção existe mas está vazia'); return; }
      sec.itens.forEach(function(i){
        totalItens++;
        var o = typeof i === 'string' ? {t:i} : i;
        if (o.v) pendencias++;
        if (!sec.fonte && !o.f) erros.push(qx.id + '/' + k + ': item sem fonte de seção nem de item — "' + o.t.slice(0,50) + '…"');
      });
      if (/^VERIFICAR/.test(sec.fonte||'')) pendencias++;
    });
  });

  var lint = '<p>' + QUEIXAS.length + ' queixas · ' + totalItens + ' itens · ' +
             CALCS.length + ' calculadoras</p>';
  lint += erros.length
    ? '<div class="sumario vermelho">' + erros.length + ' problema(s) de fonte</div><ul><li>' + erros.join('</li><li>') + '</li></ul>'
    : '<div class="sumario verde">Nenhuma seção sem fonte.</div>';
  if (pendencias) lint += '<div class="sumario amarelo">' + pendencias +
    ' marcações VERIFICAR — dívida declarada, não erro. Conferir com fonte datada antes de usar em decisão.</div>';
  document.getElementById('lint').innerHTML = lint;

  document.getElementById('sumario').innerHTML = (falhas || erros.length)
    ? '<div class="sumario vermelho">' + falhas + ' teste(s) falhando · ' + erros.length + ' problema(s) de lint</div>'
    : '<div class="sumario verde">' + linhas.length + ' testes passaram · lint limpo</div>';
})();
</script>
</body>
</html>
