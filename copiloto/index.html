<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d7a5f">
<title>Copiloto Clínico — APS</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f6f7f8; --card:#fff; --ink:#16191d; --mut:#5d666f; --line:#e2e6ea;
  --acc:#0d7a5f; --acc-w:#e8f4f0; --acc-d:#0a5f4a;
  --red:#c0392b; --red-w:#fdecea;
  --amb:#9a6700; --amb-w:#fff6e0;
  --blu:#1f5f9e; --blu-w:#eaf2fb;
  --r:12px; --rs:5px; --rm:10px;
  --fs-xs:.625rem; --fs-sm:.75rem; --fs-md:.875rem; --fs-lg:1rem; --fs-xl:1.125rem;
  --shadow:0 2px 10px rgba(0,0,0,.14);
  --hover:rgba(13,122,95,.06);
  --ring:0 0 0 3px rgba(13,122,95,.35);
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:4rem;
}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20; background:var(--acc); color:#fff;
  padding:.7rem .9rem calc(.7rem + env(safe-area-inset-top,0));
  box-shadow:var(--shadow);
}
.hin{max-width:820px; margin:0 auto}
.htop{display:flex; align-items:center; gap:.6rem; margin-bottom:.55rem}
.htop b{font-size:var(--fs-xl); letter-spacing:-.01em}
.htop span{font-size:var(--fs-sm); opacity:.85}
.grow{margin-left:auto}
#q{
  width:100%; padding:.72rem .9rem; font-size:var(--fs-lg); border:0; border-radius:var(--rm);
  background:#fff; color:var(--ink); -webkit-appearance:none;
}
#q:focus{outline:3px solid rgba(255,255,255,.55)}
#count{font-size:var(--fs-sm); opacity:.9; margin-top:.4rem; min-height:1em}

button{font:inherit; cursor:pointer}
.btn{
  background:#fff; color:var(--acc); border:0; border-radius:var(--rm);
  padding:.5rem .8rem; min-height:44px; font-size:var(--fs-md); font-weight:700;
  letter-spacing:.02em; white-space:nowrap; transition:background .15s,transform .15s;
}
.btn:hover{background:var(--acc-w)}
.btn:focus-visible{outline:3px solid rgba(255,255,255,.75); outline-offset:1px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45; cursor:default; transform:none}
.btn-back{
  background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5);
  padding:.4rem .7rem; min-height:44px;
}
.btn-back:hover{background:rgba(255,255,255,.14)}

main{padding:.9rem .8rem 0; max-width:820px; margin:0 auto}

/* ---------- lista de queixas ---------- */
.qcard{
  display:block; width:100%; text-align:left; background:var(--card);
  border:1px solid var(--line); border-radius:var(--r); padding:.95rem 1rem;
  margin-bottom:.6rem; color:inherit; transition:background .15s,border-color .15s;
}
.qcard:hover{background:var(--hover); border-color:var(--acc)}
.qcard:focus-visible{outline:none; box-shadow:var(--ring); border-color:var(--acc)}
.qcard:active{background:var(--acc-w)}
.qcard b{display:block; font-size:var(--fs-lg); font-weight:600; margin-bottom:.2rem}
.qcard .meta{font-size:var(--fs-sm); color:var(--mut)}

.tag{
  font-size:var(--fs-xs); font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  padding:.2rem .42rem; border-radius:var(--rs); background:var(--acc-w); color:var(--acc);
  margin-right:.4rem;
}

/* ---------- seções da queixa ---------- */
h1{outline:none; font-size:var(--fs-xl); margin:.2rem 0 .1rem; letter-spacing:-.01em}
.upd{font-size:var(--fs-sm); color:var(--mut); margin:0 0 1.1rem}

h2{
  font-size:var(--fs-sm); text-transform:uppercase; letter-spacing:.09em; color:var(--mut);
  margin:1.6rem .2rem .55rem; font-weight:700;
}
.cnt{font-weight:700; color:var(--acc); margin-left:.35rem}

.sec{background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.sec>summary{
  padding:.85rem .95rem; font-weight:600; cursor:pointer; list-style:none;
  display:flex; align-items:center; gap:.55rem; min-height:44px;
  transition:background .15s;
}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{
  content:"›"; margin-left:auto; color:var(--mut); font-size:var(--fs-xl); line-height:1;
  transform:rotate(90deg); transition:transform .15s;
}
.sec[open]>summary::after{transform:rotate(-90deg)}
.sec[open]>summary{border-bottom:1px solid var(--line)}
.sec>summary:hover{background:var(--hover)}
.sec>summary:focus-visible{outline:none; box-shadow:inset var(--ring)}
.body{padding:.85rem .95rem 1rem}

/* red flags: sempre aberta, sem summary */
.rf{background:var(--red-w); border:1px solid var(--red); border-radius:var(--r); padding:.85rem .95rem}
.rf h2{
  margin:0 0 .5rem; font-size:var(--fs-sm); text-transform:uppercase; letter-spacing:.06em;
  color:var(--red); font-weight:800;
}

ul{margin:0; padding-left:1.15rem}
li{margin:.4rem 0}
.rf ul{padding-left:1.05rem}

.vf{
  display:inline-block; font-size:var(--fs-xs); font-weight:800; letter-spacing:.05em;
  background:var(--amb); color:#fff; padding:.08rem .34rem; border-radius:var(--rs);
  margin-right:.35rem; vertical-align:.08em;
}
li.v{background:var(--amb-w); margin-left:-.5rem; padding:.3rem .5rem; border-radius:var(--rs); list-style-position:inside}
.src{font-size:var(--fs-sm); color:var(--mut); margin-top:.7rem; font-style:italic}

/* ---------- calculadora ---------- */
.calc{border-top:1px solid var(--line); padding-top:.8rem; margin-top:.8rem}
.calc:first-child{border-top:0; padding-top:0; margin-top:0}
.calc>b{display:block; font-size:var(--fs-md); margin-bottom:.15rem}
.calc .intro{font-size:var(--fs-md); color:var(--mut); margin:.15rem 0 .5rem}
.f{display:flex; align-items:center; gap:.5rem; margin:.4rem 0; flex-wrap:wrap}
.f label{flex:1 1 11rem; font-size:var(--fs-md)}
.f input,.f select{
  font:inherit; font-size:var(--fs-md); padding:.5rem .6rem; min-height:44px;
  border:1px solid var(--line); border-radius:var(--rm); background:#fff; color:var(--ink);
  transition:border-color .15s,box-shadow .15s;
}
.f input{width:7.5rem}
.f select{flex:1 1 12rem; max-width:22rem}
.f input:hover,.f select:hover{border-color:var(--mut)}
.f input:focus,.f select:focus{outline:none; border-color:var(--acc); box-shadow:var(--ring)}
.f input.erro{border-color:var(--red); background:var(--red-w)}
.f .un{font-size:var(--fs-sm); color:var(--mut); min-width:3.2rem}
.res{margin-top:.6rem; padding:.6rem .75rem; border-radius:var(--rm); border-left:3px solid var(--line); background:var(--bg)}
.res b{font-size:var(--fs-xl)}
.res.acc{border-color:var(--acc); background:var(--acc-w)}
.res.amb{border-color:var(--amb); background:var(--amb-w)}
.res.red{border-color:var(--red); background:var(--red-w)}
.res.blu{border-color:var(--blu); background:var(--blu-w)}
.alerta{margin-top:.55rem; padding:.6rem .75rem; border-radius:var(--rm);
        background:var(--red-w); border-left:3px solid var(--red); color:var(--red); font-weight:600}

/* ---------- checkbox ---------- */
.ck{display:flex; align-items:flex-start; gap:.65rem; padding:.45rem .3rem; border-radius:var(--rm);
    cursor:pointer; min-height:44px; transition:background .15s}
.ck:hover{background:var(--hover)}
.ck input{width:22px; height:22px; margin:.15rem 0 0; accent-color:var(--acc); flex:none; cursor:pointer}
.ck input:focus-visible{outline:none; box-shadow:var(--ring); border-radius:var(--rs)}
.ck input:checked+span{color:var(--mut); text-decoration:line-through}
.ck span{flex:1}

.t-nesta{background:var(--blu-w); color:var(--blu)}

/* ---------- revisão de fechamento ---------- */
.btn-rev{background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.5)}
.btn-rev:hover{background:rgba(255,255,255,.28)}
.btn-rev.alerta-pend{background:#fff; color:var(--red); border-color:#fff}
.rev-q{margin-bottom:1.4rem}
.rev-q>b{display:block; font-size:var(--fs-lg); margin-bottom:.5rem}
.pend{border-radius:var(--r); border:1px solid var(--line); background:var(--card);
      padding:.75rem .9rem; margin-bottom:.55rem}
.pend.crit{border-color:var(--red); background:var(--red-w)}
.pend>b{display:block; font-size:var(--fs-sm); text-transform:uppercase; letter-spacing:.06em;
        color:var(--mut); margin-bottom:.4rem}
.pend.crit>b{color:var(--red)}
.pend ul{padding-left:1.1rem}
.tudo-ok{background:var(--acc-w); border:1px solid var(--acc); border-radius:var(--r);
         padding:1rem; color:var(--acc); font-weight:600}

/* ---------- estado vazio ---------- */
.vazio{padding:2rem .5rem; color:var(--mut)}
.vazio p{margin:0 0 .8rem}
footer{max-width:820px; margin:2.5rem auto 0; padding:1rem .9rem;
       color:var(--mut); font-size:var(--fs-sm); border-top:1px solid var(--line)}
.hide{display:none !important}
@media(min-width:640px){ body{font-size:17px} main{padding-top:1.2rem} }
@media(prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>

<header>
  <div class="hin">
    <div class="htop">
      <b>Copiloto Clínico</b><span>APS · USF</span>
      <span class="grow"></span>
      <button class="btn btn-back hide" id="voltar" type="button">‹ Queixas</button>
      <button class="btn btn-rev hide" id="revisar" type="button">Revisar consulta</button>
      <button class="btn" id="novo" type="button" disabled>Novo paciente</button>
    </div>
    <input id="q" type="search" placeholder="Buscar: suicídio, insônia, metformina, pé diabético…"
           autocomplete="off" spellcheck="false" aria-label="Buscar queixa">
    <div id="count" role="status"></div>
  </div>
</header>

<main>
  <div id="lista"></div>
  <div id="detalhe" class="hide"></div>
  <div id="revisao" class="hide"></div>
</main>

<footer>
  Apoio à decisão de uso pessoal. Não substitui o protocolo institucional, a avaliação
  do preceptor nem o registro oficial do serviço. Nenhum dado de paciente é gravado.
</footer>

<script src="queixas.js"></script>
<script src="calculadoras.js"></script>
<script>
(function(){
  var elQ = document.getElementById('q'),
      elLista = document.getElementById('lista'),
      elDet = document.getElementById('detalhe'),
      elCount = document.getElementById('count'),
      elVoltar = document.getElementById('voltar'),
      elNovo = document.getElementById('novo'),
      elRev = document.getElementById('revisao'),
      elRevisar = document.getElementById('revisar'),
      marcados = {},          // estado dos checkboxes: só em memória, nunca localStorage
      naConsulta = [],        // queixas abertas nesta consulta, em ordem. Some no "Novo paciente"
      vista = 'lista',        // lista | detalhe | revisao
      atual = null;

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function norm(s){
    return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }
  function item(i){ return typeof i === 'string' ? {t:i} : i; }

  /* Ordem de renderização, fixa aqui e não nos dados.
     Red flags primeiro porque com paciente na frente o que causa dano é o que passa
     despercebido. `ck` marca as duas seções que se EXECUTAM (as outras são leitura). */
  var SECOES = [
    {k:'perguntas', r:'Perguntas essenciais',  ck:true},
    {k:'exame',     r:'Exame físico direcionado', ck:true},
    {k:'naoperder', r:'Não posso perder'},
    {k:'ddx',       r:'Diagnósticos diferenciais'},
    {k:'exames',    r:'Exames a discutir'},
    {k:'conduta',   r:'Conduta a discutir com a equipe'},
    {k:'erros',     r:'Erros comuns'}
  ];

  function textoDe(qx){
    var t = qx.nome + ' ' + (qx.kw||'') + ' ' + (qx.tag||'');
    Object.keys(qx).forEach(function(k){
      var s = qx[k];
      if (s && s.itens) {
        t += ' ' + (s.fonte||'');
        s.itens.forEach(function(i){ t += ' ' + item(i).t; });
      }
    });
    return norm(t);
  }
  QUEIXAS.forEach(function(qx){ qx._txt = textoDe(qx); });

  /* ---------- lista ---------- */
  function nItens(qx){
    return SECOES.concat([{k:'redflags'}]).reduce(function(n,s){
      return n + (qx[s.k] && qx[s.k].itens ? qx[s.k].itens.length : 0);
    }, 0);
  }

  function renderLista(termo){
    var vis = QUEIXAS;
    if (termo) {
      var ts = norm(termo).split(/\s+/);
      vis = QUEIXAS.filter(function(qx){
        return ts.every(function(w){ return qx._txt.indexOf(w) > -1; });
      });
    }
    if (!vis.length) {
      elLista.innerHTML = '<div class="vazio"><p>Nada encontrado para <b>' + esc(termo) +
        '</b>. O copiloto cobre hoje:</p>' +
        QUEIXAS.map(function(qx){
          return '<button class="qcard" type="button" data-id="' + qx.id + '"><b>' +
                 esc(qx.nome) + '</b></button>';
        }).join('') + '</div>';
    } else {
      elLista.innerHTML = vis.map(function(qx){
        var aberta = naConsulta.indexOf(qx.id) > -1;
        return '<button class="qcard" type="button" data-id="' + esc(qx.id) + '">' +
          '<b>' + esc(qx.nome) + '</b><span class="meta">' +
          (qx.tag ? '<span class="tag">' + esc(qx.tag) + '</span>' : '') +
          (aberta ? '<span class="tag t-nesta">nesta consulta</span>' : '') +
          nItens(qx) + ' itens · atualizado ' + esc(qx.atualizado || '—') +
          '</span></button>';
      }).join('');
    }
    elCount.textContent = termo
      ? (vis.length ? vis.length + (vis.length > 1 ? ' queixas' : ' queixa') : 'nenhuma queixa')
      : '';
  }

  /* ---------- detalhe ---------- */
  function liHTML(i){
    var o = item(i);
    var badge = o.v ? '<span class="vf">VERIFICAR</span>' : '';
    var fonte = o.f ? ' <span class="src" style="display:inline;margin:0">(' + esc(o.f) + ')</span>' : '';
    return '<li' + (o.v ? ' class="v"' : '') + '>' + badge + esc(o.t) + fonte + '</li>';
  }

  function fonteHTML(sec){
    if (!sec.fonte) return '';
    var pend = /^VERIFICAR/.test(sec.fonte);
    return '<div class="src">' + (pend ? '<span class="vf">VERIFICAR</span>' : 'Fonte: ') +
           esc(pend ? sec.fonte.replace(/^VERIFICAR\s*—?\s*/, '') : sec.fonte) + '</div>';
  }

  function renderDetalhe(qx){
    var h = '<h1 tabindex="-1">' + esc(qx.nome) + '</h1><p class="upd">Atualizado em ' +
            esc(qx.atualizado || '—') + '</p>';

    /* Red flag marcável: exibir e torcer para ser lida é livro de consulta.
       Marcar significa "procurei e descartei" — é isso que a revisão de fechamento cobra. */
    if (qx.redflags && qx.redflags.itens && qx.redflags.itens.length) {
      h += '<div class="rf"><h2>Red flags<span class="cnt" data-cnt="redflags"></span></h2>' +
           qx.redflags.itens.map(function(i, n){
             var o = item(i), id = qx.id + '.redflags.' + n;
             return '<label class="ck"><input type="checkbox" data-ck="' + id + '"' +
                    (marcados[id] ? ' checked' : '') + '><span>' +
                    (o.v ? '<span class="vf">VERIFICAR</span>' : '') + esc(o.t) + '</span></label>';
           }).join('') +
           '<p class="src" style="margin-top:.5rem">Marcar conforme descartar. ' +
           'O que ficar em branco aparece na revisão de fechamento.</p>' +
           fonteHTML(qx.redflags) + '</div>';
    }

    SECOES.forEach(function(s){
      var sec = qx[s.k];
      if (!sec || !sec.itens || !sec.itens.length) return;   // seção ausente não renderiza
      h += '<h2>' + esc(s.r) + (s.ck ? '<span class="cnt" data-cnt="' + s.k + '"></span>' : '') + '</h2>';
      h += '<details class="sec" open><summary>' + sec.itens.length + ' itens</summary><div class="body">';
      if (s.ck) {
        h += sec.itens.map(function(i, n){
          var o = item(i), id = qx.id + '.' + s.k + '.' + n;
          return '<label class="ck"><input type="checkbox" data-ck="' + id + '"' +
                 (marcados[id] ? ' checked' : '') + '><span>' +
                 (o.v ? '<span class="vf">VERIFICAR</span>' : '') + esc(o.t) + '</span></label>';
        }).join('');
      } else {
        h += '<ul>' + sec.itens.map(liHTML).join('') + '</ul>';
      }
      h += fonteHTML(sec) + '</div></details>';
    });

    var calcs = (qx.scores || []).map(function(id){
      return CALCS.filter(function(c){ return c.id === id; })[0];
    }).filter(Boolean);
    if (calcs.length) {
      h += '<h2>Calculadoras</h2><details class="sec" open><summary>' + calcs.length +
           (calcs.length > 1 ? ' ferramentas' : ' ferramenta') + '</summary><div class="body">' +
           calcs.map(calcHTML).join('') + '</div></details>';
    }

    elDet.innerHTML = h;
    elDet.querySelectorAll('[data-calc]').forEach(calcular);
    atualizaContadores();
  }

  /* ---------- calculadoras ---------- */
  function calcHTML(c){
    var h = '<div class="calc" data-calc="' + esc(c.id) + '"><b>' + esc(c.nome) + '</b>';
    if (c.intro) h += '<p class="intro">' + esc(c.intro) + '</p>';
    c.campos.forEach(function(f){
      h += '<div class="f"><label for="' + esc(c.id + '-' + f.id) + '">' + esc(f.rot) + '</label>';
      if (f.tipo === 'opt') {
        h += '<select id="' + esc(c.id + '-' + f.id) + '" data-f="' + esc(f.id) + '"><option value="">—</option>' +
             f.opts.map(function(o){ return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('') +
             '</select>';
      } else if (f.tipo === 'data') {
        h += '<input id="' + esc(c.id + '-' + f.id) + '" data-f="' + esc(f.id) + '" type="date" style="width:auto">';
      } else {
        h += '<input id="' + esc(c.id + '-' + f.id) + '" data-f="' + esc(f.id) + '" type="number" inputmode="decimal"' +
             (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') +
             (f.passo ? ' step="' + f.passo + '"' : '') + '>';
      }
      h += '<span class="un">' + esc(f.un || '') + '</span></div>';
    });
    h += '<div class="res hide"></div><div class="alerta hide"></div>';
    h += '<div class="src">Fonte: ' + esc(c.fonte) + (c.nota ? ' — ' + esc(c.nota) : '') + '</div></div>';
    return h;
  }

  function calcular(box){
    var c = CALCS.filter(function(x){ return x.id === box.dataset.calc; })[0];
    var v = {}, faltou = false, invalido = false;
    c.campos.forEach(function(f){
      var el = box.querySelector('[data-f="' + f.id + '"]');
      var raw = el.value;
      if (raw === '') { faltou = true; el.classList.remove('erro'); return; }
      if (f.tipo === 'num') {
        var n = parseFloat(raw);
        var mau = isNaN(n) || (f.min != null && n < f.min) || (f.max != null && n > f.max);
        el.classList.toggle('erro', mau);
        if (mau) { invalido = true; return; }
        v[f.id] = n;
      } else { v[f.id] = raw; }
    });

    var res = box.querySelector('.res'), alerta = box.querySelector('.alerta');
    if (faltou || invalido) { res.classList.add('hide'); alerta.classList.add('hide'); return; }

    var out = c.calc(v);
    res.className = 'res';
    if (typeof out === 'number') {
      var fx = (c.faixas || []).filter(function(f){ return out >= f[0]; })[0];
      res.innerHTML = '<b>' + out.toFixed(1).replace('.', ',') + '</b> ' + esc(c.un || '') +
                      (fx ? ' — ' + esc(fx[1]) : '');
      if (fx) res.classList.add(fx[2]);
    } else {
      res.innerHTML = '<b>' + esc(out) + '</b>';
      res.classList.add('blu');
    }
    var a = c.alerta && c.alerta(v);
    alerta.classList.toggle('hide', !a);
    if (a) alerta.textContent = a;
  }

  /* ---------- contadores e estado ---------- */
  function atualizaContadores(){
    if (atual) elDet.querySelectorAll('[data-cnt]').forEach(function(el){
      var cks = elDet.querySelectorAll('[data-ck^="' + atual.id + '.' + el.dataset.cnt + '."]');
      var n = 0;
      cks.forEach(function(c){ if (c.checked) n++; });
      el.textContent = n ? n + '/' + cks.length : '';
    });
    var algum = Object.keys(marcados).some(function(k){ return marcados[k]; });
    elNovo.disabled = !algum && !naConsulta.length;
    atualizaBotaoRevisar();
  }

  /* ---------- sessão de consulta ---------- */
  function pendencias(){
    /* O que ficou por fazer nas queixas abertas NESTA consulta.
       Red flag não marcada é crítica: é o que causa dano por passar despercebido. */
    return naConsulta.map(function(id){
      var qx = QUEIXAS.filter(function(x){ return x.id === id; })[0];
      if (!qx) return null;
      var grupos = [];
      [{k:'redflags', r:'Red flags não descartadas', crit:true}]
        .concat(SECOES.filter(function(s){ return s.ck; })
                      .map(function(s){ return {k:s.k, r:s.r + ' que ficaram em branco'}; }))
        .forEach(function(g){
          var sec = qx[g.k];
          if (!sec || !sec.itens) return;
          var faltando = sec.itens.filter(function(i, n){ return !marcados[qx.id + '.' + g.k + '.' + n]; })
                                  .map(function(i){ return item(i).t; });
          if (faltando.length) grupos.push({rotulo:g.r, itens:faltando, crit:!!g.crit});
        });
      return {qx: qx, grupos: grupos};
    }).filter(Boolean);
  }

  function atualizaBotaoRevisar(){
    elRevisar.classList.toggle('hide', !naConsulta.length);
    if (!naConsulta.length) return;
    var criticas = pendencias().reduce(function(n, p){
      return n + p.grupos.filter(function(g){ return g.crit; }).reduce(function(m, g){ return m + g.itens.length; }, 0);
    }, 0);
    elRevisar.textContent = criticas ? 'Revisar · ' + criticas + ' red flag' + (criticas > 1 ? 's' : '') : 'Revisar consulta';
    elRevisar.classList.toggle('alerta-pend', criticas > 0);
  }

  function renderRevisao(){
    var ps = pendencias();
    var h = '<h1 tabindex="-1">Antes de fechar a consulta</h1><p class="upd">' +
            naConsulta.length + (naConsulta.length > 1 ? ' queixas abertas' : ' queixa aberta') +
            ' nesta consulta. Nada aqui é gravado.</p>';
    var vazio = ps.every(function(p){ return !p.grupos.length; });
    if (vazio) {
      h += '<div class="tudo-ok">Nenhuma pendência: todas as red flags foram descartadas e ' +
           'os checklists de anamnese e exame estão completos.</div>';
    } else {
      ps.forEach(function(p){
        if (!p.grupos.length) return;
        h += '<div class="rev-q"><b>' + esc(p.qx.nome) + '</b>';
        p.grupos.forEach(function(g){
          h += '<div class="pend' + (g.crit ? ' crit' : '') + '"><b>' + esc(g.rotulo) +
               ' (' + g.itens.length + ')</b><ul>' +
               g.itens.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';
        });
        h += '</div>';
      });
    }
    elRev.innerHTML = h;
  }

  function mostrar(v){
    vista = v;
    elLista.classList.toggle('hide', v !== 'lista');
    elDet.classList.toggle('hide', v !== 'detalhe');
    elRev.classList.toggle('hide', v !== 'revisao');
    elVoltar.classList.toggle('hide', v === 'lista');
    window.scrollTo(0, 0);
  }

  function irPara(qx){
    atual = qx;
    if (naConsulta.indexOf(qx.id) < 0) naConsulta.push(qx.id);
    renderDetalhe(qx);
    mostrar('detalhe');
    elCount.textContent = '';
    /* Trocar de tela sem mover o foco deixa quem usa teclado ou leitor de tela
       preso no fim da lista anterior. O h1 é o começo do novo contexto. */
    var h1 = elDet.querySelector('h1'); if (h1) h1.focus();
  }

  function irRevisao(){
    atual = null;
    renderRevisao();
    mostrar('revisao');
    var h1 = elRev.querySelector('h1'); if (h1) h1.focus();
  }

  /* devolverFoco só quando a saída foi deliberada (botão ou Esc). Ao voltar porque
     o usuário começou a digitar na busca, mexer no foco tiraria ele do campo. */
  function voltar(devolverFoco){
    var volta = atual && atual.id;
    atual = null;
    elDet.innerHTML = ''; elRev.innerHTML = '';
    mostrar('lista');
    renderLista(elQ.value.trim());
    atualizaBotaoRevisar();
    if (!devolverFoco) return;
    var card = volta && elLista.querySelector('[data-id="' + volta + '"]');
    if (card) card.focus();
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click', function(e){
    var card = e.target.closest('.qcard');
    if (card) {
      var qx = QUEIXAS.filter(function(x){ return x.id === card.dataset.id; })[0];
      if (qx) irPara(qx);
    }
  });

  elDet.addEventListener('change', function(e){
    if (e.target.dataset.ck) { marcados[e.target.dataset.ck] = e.target.checked; atualizaContadores(); }
    var box = e.target.closest('[data-calc]'); if (box) calcular(box);
  });
  elDet.addEventListener('input', function(e){
    var box = e.target.closest('[data-calc]'); if (box) calcular(box);
  });

  elVoltar.addEventListener('click', function(){ voltar(true); });
  elRevisar.addEventListener('click', irRevisao);

  /* Fim da consulta: zera tudo. É o único lugar onde o estado morre, e ele morre
     inteiro — marcações, campos de calculadora e a lista de queixas da consulta. */
  elNovo.addEventListener('click', function(){
    marcados = {}; naConsulta = [];
    elDet.querySelectorAll('[data-ck]').forEach(function(c){ c.checked = false; });
    elDet.querySelectorAll('[data-calc]').forEach(function(box){
      box.querySelectorAll('[data-f]').forEach(function(el){ el.value=''; el.classList.remove('erro'); });
      calcular(box);
    });
    if (vista === 'revisao') voltar(false); else atualizaContadores();
    elNovo.disabled = true;
    elRevisar.classList.add('hide');
  });

  elQ.addEventListener('input', function(){
    if (vista !== 'lista') voltar(false); else renderLista(elQ.value.trim());
  });

  document.addEventListener('keydown', function(e){
    if (e.key === '/' && document.activeElement !== elQ) { e.preventDefault(); elQ.focus(); elQ.select(); }
    else if (e.key === 'Escape') {
      if (vista !== 'lista') voltar(true);
      else if (elQ.value) { elQ.value = ''; renderLista(''); }
    }
  });

  renderLista('');
})();
</script>
</body>
</html>
